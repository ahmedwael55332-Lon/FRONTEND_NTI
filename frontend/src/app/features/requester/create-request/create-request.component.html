<app-dashboard-layout
  title="Requester Portal"
  subtitle="Create Request"
  [navItems]="navItems"
>
  <div class="page-head">
    <div>
      <span class="eyebrow">NEW REQUEST</span>
      <h2>Create Blood Request</h2>
      <p>Only fields supported by the backend are collected.</p>
    </div>
  </div>

  <div class="card">

    <!-- Success Message -->
    <div class="notice success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div class="notice error-notice" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form
      [formGroup]="requestForm"
      (ngSubmit)="submit()"
      novalidate
    >

      <div class="form-grid">

        <!-- Blood Type -->
        <div class="field">
          <label for="bloodType">Blood Type</label>

          <select
            id="bloodType"
            formControlName="bloodType"
          >
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
          </select>

          <small
            class="field-error"
            *ngIf="
              requestForm.controls.bloodType.touched &&
              requestForm.controls.bloodType.invalid
            "
          >
            Please select a blood type.
          </small>
        </div>

        <!-- Rh -->
        <div class="field">
          <label for="rh">Rh</label>

          <select
            id="rh"
            formControlName="rh"
          >
            <option value="Positive">Positive</option>
            <option value="Negative">Negative</option>
          </select>

          <small
            class="field-error"
            *ngIf="
              requestForm.controls.rh.touched &&
              requestForm.controls.rh.invalid
            "
          >
            Please select the Rh factor.
          </small>
        </div>

        <!-- Urgency -->
        <div class="field full">
          <label for="urgency">Urgency</label>

          <select
            id="urgency"
            formControlName="urgency"
          >
            <option value="normal">Normal</option>
            <option value="emergency">Emergency</option>
          </select>

          <small
            class="field-error"
            *ngIf="
              requestForm.controls.urgency.touched &&
              requestForm.controls.urgency.invalid
            "
          >
            Please select the urgency.
          </small>
        </div>

      </div>

      <div class="actions" style="margin-top:20px">

        <button
          type="button"
          class="btn secondary"
          (click)="cancel()"
          [disabled]="loading"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn primary"
          [disabled]="loading"
        >
          {{ loading ? 'Creating...' : 'Create Request' }}
        </button>

      </div>

    </form>

  </div>
</app-dashboard-layout>
