<app-dashboard-layout title="My Profile" subtitle="Account Settings" [navItems]="navItems">
  <div class="page-head">
    <div>
      <span class="eyebrow">ACCOUNT</span>
      <h2>My Profile</h2>
      <p>Manage your account information.</p>
    </div>
    <button class="btn primary" type="button" (click)="saveChanges()" [disabled]="saving || loading">
      {{ saving ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>

  <div class="notice" *ngIf="loading">Loading profile...</div>
  <div class="notice error-notice" *ngIf="!loading && errorMessage">{{ errorMessage }}</div>
  <div class="notice success-notice" *ngIf="!loading && successMessage">{{ successMessage }}</div>

  <div class="card" *ngIf="!loading">
    <div class="form-grid">
      <div class="field">
        <label for="profile-name">Name</label>
        <input id="profile-name" type="text" [formControl]="form.controls.name" placeholder="Your name">
        <small class="field-error" *ngIf="form.controls.name.touched && form.controls.name.invalid">
          Name is required and must be 2–50 characters.
        </small>
      </div>
      <div class="field">
        <label for="profile-email">Email</label>
        <input id="profile-email" type="email" [formControl]="form.controls.email">
      </div>
      <div class="field full">
        <label for="profile-role">Role</label>
        <input id="profile-role" [formControl]="form.controls.role">
      </div>
    </div>
  </div>
</app-dashboard-layout>
