<div
  *ngIf="confirmService.isOpen"
  class="confirm-backdrop"
  (click)="!confirmService.isLoading && cancel()"
>
  <section
    class="confirm-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title'"
    (click)="$event.stopPropagation()"
  >
    <div class="confirm-icon" aria-hidden="true">
      <span class="material-symbols-outlined">
        {{ confirmService.options?.icon || 'warning' }}
      </span>
    </div>

    <div class="confirm-content">
      <h2 id="confirm-title">
        {{ confirmService.options?.title }}
      </h2>

      <p>
        {{ confirmService.options?.message }}
      </p>
    </div>

    <div class="confirm-actions">
      <button
        type="button"
        class="confirm-btn cancel"
        (click)="cancel()"
        [disabled]="confirmService.isLoading"
      >
        {{ confirmService.options?.cancelText || 'Cancel' }}
      </button>

      <button
        type="button"
        class="confirm-btn danger"
        (click)="confirm()"
        [disabled]="confirmService.isLoading"
      >
        <span
          *ngIf="confirmService.isLoading"
          class="spinner"
          aria-hidden="true"
        ></span>

        {{ confirmService.isLoading
          ? (confirmService.options?.loadingText || 'Processing...')
          : (confirmService.options?.confirmText || 'Confirm') }}
      </button>
    </div>
  </section>
</div>
